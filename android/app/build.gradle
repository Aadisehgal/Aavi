// MANU AI — J.A.R.V.I.S. Edition v2.0
// Part 20/20 — Build Environment & Final Integration
// File: android/app/build.gradle
// Generated: 2026-06-25

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "com.manu.ai"
    compileSdkVersion 34
    buildFeatures {
        buildConfig true
    }
    buildToolsVersion "34.0.0"
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.manu.ai"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 20
        versionName "2.0.0"

        // ARM64 ONLY — Termux/Security Tool Compatibility
        ndk {
            abiFilters "arm64-v8a"
        }

        // JSC Engine (Hermes Disabled for Compatibility)
        buildConfigField "boolean", "IS_HERMES_ENABLED", "false"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('release.keystore')
            storePassword System.getenv("MANU_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("MANU_KEY_ALIAS") ?: ""
            keyPassword System.getenv("MANU_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-location:21.0.1"
    // React Native Core (JSC — Hermes Disabled)
    implementation("com.facebook.react:react-android:0.74.3")

    // Kotlin Standard Library
    implementation("org.jetbrains.kotlin:kotlin-stdlib:1.9.22")

    // AndroidX Core
    implementation("androidx.core:core-ktx:1.12.0")

    // AdMob (Google Mobile Ads)
    implementation("com.google.android.gms:play-services-ads:22.6.0")
    implementation("androidx.biometric:biometric:1.1.0")
    implementation("com.google.zxing:core:3.5.2")

    // Termux:API Bridge (Runtime Only — Educational Shell Access)
    // termux-api removed
}

// React Native Gradle Plugin Configuration
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)
