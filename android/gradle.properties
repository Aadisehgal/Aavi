# ============================================================
# Gradle Configuration — Hermes Disabled, ARM64 Only
# React Native 0.74.3 | Termux Build Environment
# ============================================================

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Hermes DISABLED — x86_64 compiler incompatible with Termux
hermesEnabled=false

# New Architecture (Fabric) — disabled for stability
newArchEnabled=false

# JSC Engine (JavaScriptCore) — required for Termux builds
jsEngine=jsc

# Build Optimization
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.caching=true

# ARM64 Only
reactNativeArchitectures=arm64-v8a

# Flipper — disabled for release builds
FLIPPER_VERSION=0.250.0

# Console output
ANDROID_STUDIO=never
